name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          tar czf /tmp/points.tar.gz server public deploy package.json package-lock.json
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new /tmp/points.tar.gz "$USER@$HOST:/tmp/points.tar.gz"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new deploy/remote.sh "$USER@$HOST:/tmp/remote.sh"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$USER@$HOST" "bash /tmp/remote.sh"
