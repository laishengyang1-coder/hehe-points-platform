<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安徽和和海外事业部积分平台</title>
<style>
:root{
  --navy:#15233c; --navy-2:#1d2f4d; --navy-3:#27395c;
  --blue:#2563eb; --blue-d:#1e40af; --blue-bg:#eaf1fe;
  --gold:#a9801a; --gold-2:#c79720; --gold-bg:#f6efdd;
  --ink:#1a2433; --ink-2:#5b6675; --ink-3:#8a93a3;
  --bg:#f3f5f8; --card:#ffffff; --line:#e7eaf0; --line-2:#eef1f5;
  --green:#15803d; --green-bg:#e8f4ec;
  --red:#b91c1c; --red-bg:#fbecec;
  --amber:#b45309; --amber-bg:#fbf1e0;
  --cyan:#0e7490; --cyan-bg:#e3f4f7;
  --purple:#6d28d9; --purple-bg:#f0ebfb;
  --radius:8px; --radius-sm:6px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
a{text-decoration:none}
.svg-ico{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0}
.login-screen{display:flex;min-height:100vh;background:var(--bg)}
.login-brand{flex:0 0 44%;max-width:520px;background:var(--navy);color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand::after{content:"";position:absolute;right:-120px;top:-120px;width:320px;height:320px;border:1px solid rgba(255,255,255,.06);border-radius:50%}
.login-brand::before{content:"";position:absolute;right:-60px;bottom:-120px;width:260px;height:260px;border:1px solid rgba(255,255,255,.05);border-radius:50%}
.login-brand-top{display:flex;align-items:center;gap:14px;z-index:1}
.login-brand-mark{width:46px;height:46px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#1a2433;font-weight:800;font-size:20px;flex-shrink:0}
.login-brand-name{font-size:18px;font-weight:700;letter-spacing:.5px}
.login-brand-name small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:2px}
.login-brand-mid{z-index:1}
.login-brand-title{font-size:34px;font-weight:800;line-height:1.3;margin-bottom:16px}
.login-brand-title .accent{color:var(--gold-2)}
.login-brand-desc{font-size:14px;color:rgba(255,255,255,.55);line-height:1.9;max-width:360px}
.login-brand-foot{font-size:12px;color:rgba(255,255,255,.35);z-index:1}
.login-form-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.login-form-card{width:380px;max-width:100%}
.login-form-kicker{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.login-form-title{font-size:24px;font-weight:800;color:var(--ink);margin-bottom:28px}
.role-tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--line-2);border-radius:var(--radius);padding:4px}
.role-tab{flex:1;padding:11px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--ink-2);font-size:14px;cursor:pointer;transition:all .15s;font-weight:600}
.role-tab.active{background:var(--navy);color:#fff;box-shadow:var(--shadow-sm)}
.login-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.login-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;outline:none;transition:border .15s,box-shadow .15s;background:#fff;color:var(--ink);font-family:inherit;margin-bottom:16px}
.login-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.login-btn{width:100%;padding:13px;background:var(--navy);border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:2px;margin-top:4px}
.login-btn:hover{background:var(--navy-3)}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--ink-3);font-size:12px}
.login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.login-demo{font-size:13px;color:var(--ink-2);line-height:2}
.login-demo span{color:var(--blue);cursor:pointer;font-weight:600}
.login-demo span:hover{text-decoration:underline}
.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:fixed;height:100vh;z-index:50;flex-shrink:0}
.sidebar-header{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px}
.sidebar-mark{width:38px;height:38px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#1a2433;font-weight:800;font-size:17px;flex-shrink:0}
.sidebar-logo-text{font-size:15px;font-weight:700;line-height:1.3}
.sidebar-logo-text small{font-size:10px;font-weight:400;color:rgba(255,255,255,.45);display:block;margin-top:2px;letter-spacing:1px}
.sidebar-nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav-group-label{font-size:11px;color:rgba(255,255,255,.32);font-weight:600;letter-spacing:1.5px;padding:18px 12px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;color:rgba(255,255,255,.6);font-size:13.5px;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
.nav-item:hover{background:var(--navy-2);color:#fff}
.nav-item.active{background:var(--navy-2);color:#fff;border-left-color:var(--gold-2)}
.nav-item .nav-ico{color:rgba(255,255,255,.5)}
.nav-item.active .nav-ico{color:var(--gold-2)}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700}
.sidebar-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07)}
.user-card{display:flex;align-items:center;gap:11px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s}
.user-card:hover{background:var(--navy-2)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:rgba(255,255,255,.45)}
.main{flex:1;margin-left:236px;padding:28px 34px;min-height:100vh;min-width:0}
.page-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.page-title{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:.3px}
.page-desc{font-size:13.5px;color:var(--ink-2);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:22px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:18px;display:flex;align-items:center;gap:9px}
.card-title .ct-ico{color:var(--navy-3);display:flex}
.card-title .more{margin-left:auto;font-size:13px;color:var(--blue);cursor:pointer;font-weight:500}
.card-title .more:hover{text-decoration:underline}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px 20px;display:flex;align-items:center;gap:16px}
.stat-ico{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-ico.gold{background:var(--gold-bg);color:var(--gold)}
.stat-ico.green{background:var(--green-bg);color:var(--green)}
.stat-ico.blue{background:var(--blue-bg);color:var(--blue)}
.stat-ico.purple{background:var(--purple-bg);color:var(--purple)}
.stat-ico.red{background:var(--red-bg);color:var(--red)}
.stat-ico.amber{background:var(--amber-bg);color:var(--amber)}
.stat-ico.cyan{background:var(--cyan-bg);color:var(--cyan)}
.stat-value{font-size:25px;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:.5px}
.stat-label{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.points-panel{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--radius);padding:24px 28px;margin-bottom:24px;display:flex;gap:40px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.points-block{min-width:140px}
.points-num{font-size:34px;font-weight:800;color:var(--gold);line-height:1;letter-spacing:.5px}
.points-num.avail{color:var(--green)}
.points-num.rank{color:var(--blue)}
.points-cap{font-size:12.5px;color:var(--ink-2);margin-top:7px;font-weight:500}
.points-divider{width:1px;background:var(--line);align-self:stretch}
.points-note{flex:1;min-width:200px;display:flex;flex-direction:column;justify-content:center}
.points-note-label{font-size:12.5px;color:var(--ink-2)}
.points-note-val{font-size:20px;font-weight:800;color:var(--gold-2);margin:4px 0 8px}
.bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-3)}
.btn-accent{background:var(--gold);color:#fff}
.btn-accent:hover{background:var(--gold-2)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#166534}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#991b1b}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{border-color:var(--navy);color:var(--navy)}
.btn-sm{padding:6px 14px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.badge-success{background:var(--green-bg);color:var(--green)}
.badge-warning{background:var(--amber-bg);color:var(--amber)}
.badge-danger{background:var(--red-bg);color:var(--red)}
.badge-info{background:var(--blue-bg);color:var(--blue-d)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-cyan{background:var(--cyan-bg);color:var(--cyan)}
.badge-gray{background:#f1f3f6;color:var(--ink-2)}
.badge-gold{background:var(--gold-bg);color:var(--gold)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:12px 14px;border-bottom:2px solid var(--line);font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;letter-spacing:.3px}
td{padding:13px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover td{background:#fafbfc}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border .15s,box-shadow .15s;background:#fff;color:var(--ink);font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-textarea{resize:vertical;min-height:64px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
.modal-overlay{position:fixed;inset:0;background:rgba(21,35,60,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:12px;width:480px;max-width:94vw;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 20px 50px rgba(16,24,40,.25);position:relative}
.modal-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:22px;padding-right:30px}
.modal-close{position:absolute;top:20px;right:24px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-3);line-height:1}
.modal-close:hover{color:var(--ink)}
.crm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.crm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;transition:box-shadow .15s,border-color .15s}
.crm-card:hover{box-shadow:var(--shadow-md);border-color:#d9dee7}
.crm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.crm-name{font-size:15.5px;font-weight:700;color:var(--ink)}
.crm-geo{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.crm-badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.crm-detail{font-size:13px;color:var(--ink-2);line-height:1.85}
.crm-detail b{color:var(--ink);font-weight:600}
.mall-sec{margin-bottom:30px}
.mall-sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mall-sec-ico{width:38px;height:38px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mall-sec-title{font-size:17px;font-weight:800;color:var(--ink)}
.mall-sec-desc{font-size:12.5px;color:var(--ink-2)}
.mall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mall-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;transition:box-shadow .15s,border-color .15s}
.mall-item:hover{box-shadow:var(--shadow-md);border-color:#d9dee7}
.mall-item-ico{width:44px;height:44px;border-radius:10px;background:var(--gold-bg);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.mall-item-name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
.mall-item-desc{font-size:12.5px;color:var(--ink-2);margin-bottom:14px;min-height:34px}
.mall-item-ft{display:flex;align-items:center;justify-content:space-between}
.mall-item-pts{font-size:19px;font-weight:800;color:var(--gold)}
.mall-item-pts small{font-size:12px;font-weight:500;color:var(--ink-2)}
.mall-item.feature{border:1.5px solid var(--gold)}
.lb-tabs{display:flex;gap:10px;margin-bottom:22px}
.lb-tab{padding:9px 22px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2);transition:all .15s}
.lb-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.lb-row{display:flex;align-items:center;gap:16px;padding:15px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px;box-shadow:var(--shadow-sm)}
.lb-rank{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.lb-rank-1{background:var(--gold);color:#fff}
.lb-rank-2{background:#9aa3b2;color:#fff}
.lb-rank-3{background:#b07e3a;color:#fff}
.lb-rank-n{background:#f1f3f6;color:var(--ink-2)}
.lb-name{flex:1;font-weight:700;font-size:14.5px;color:var(--ink)}
.lb-sub{font-size:12.5px;color:var(--ink-2);font-weight:400;margin-top:2px}
.lb-pts{font-size:19px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.act-list{padding:0}
.act-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.act-item:last-child{border-bottom:none}
.act-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.act-dot.gold{background:var(--gold)} .act-dot.green{background:var(--green)}
.act-dot.red{background:var(--red)} .act-dot.blue{background:var(--blue)} .act-dot.purple{background:var(--purple)}
.act-body{flex:1;font-size:13.5px;line-height:1.6;color:var(--ink)}
.act-time{font-size:12px;color:var(--ink-3);margin-top:3px}
.review-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px}
.review-ava{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.review-body{flex:1;min-width:0}
.review-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.review-desc{font-size:13px;color:var(--ink-2);line-height:1.5}
.review-pts{font-size:20px;font-weight:800;color:var(--gold);flex-shrink:0;letter-spacing:.5px}
.review-actions{display:flex;gap:8px;flex-shrink:0}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa-btn{display:flex;align-items:center;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;transition:all .15s;font-size:14px;font-weight:600;color:var(--ink)}
.qa-btn:hover{border-color:var(--navy);background:#fafbfc}
.qa-btn .qa-ico{color:var(--navy)}
.note-box{margin-top:16px;padding:14px 16px;background:var(--gold-bg);border-radius:var(--radius-sm);border-left:3px solid var(--gold);font-size:13px;color:var(--ink)}
.note-box b{color:var(--gold)}
.info-note{background:var(--blue-bg);border-radius:var(--radius-sm);padding:14px 16px;font-size:13.5px;color:var(--blue-d);line-height:1.7;border-left:3px solid var(--blue)}
.info-note b{font-weight:700}
#toast{position:fixed;top:22px;right:22px;background:var(--navy);color:#fff;padding:13px 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;z-index:999;display:none;box-shadow:var(--shadow-md);border-left:3px solid var(--gold-2)}
.menu-toggle{display:none}
@media(max-width:860px){
  .login-brand{display:none}
  .sidebar{transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-md)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:18px}
  .menu-toggle{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--navy);color:#fff;border-radius:var(--radius-sm);margin-bottom:18px;cursor:pointer;font-size:14px;font-weight:600}
}
/* ---- extra utility ---- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-actions{display:flex;gap:10px;flex-shrink:0}
.filter-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.filter-bar .form-select{width:auto;min-width:150px}
.filter-bar .form-input{width:auto;min-width:210px}
.empty-tip{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13.5px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.mini-stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px;background:var(--line-2);border-radius:var(--radius-sm)}
.mini-stat b{font-size:19px;color:var(--navy)}
.mini-stat span{font-size:12px;color:var(--ink-2)}
.footer-note{margin-top:26px;padding:14px 16px;background:#f8f9fb;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink-3);line-height:1.9}
.lb-row.me{border-color:var(--gold);background:var(--gold-bg)}
.lb-me-badge{margin-left:auto;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.5px}
.pos{color:var(--green);font-weight:700}

<script>/* ================= API 封装 ================= */
let TOKEN = localStorage.getItem('pp_token') || '';
async function api(path, method, body){
  const opt = { method: method || 'GET', headers: {} };
  if(TOKEN) opt.headers['Authorization'] = 'Bearer ' + TOKEN;
  if(body !== undefined){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch('/api' + path, opt);
  const data = await res.json().catch(function(){ return {}; });
  if(res.status === 401 && path.indexOf('/login') !== 0){
    logout(); throw new Error('登录已过期，请重新登录');
  }
  if(!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function icon(n, s){ s = s || 18; return '<svg class="svg-ico" width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || '') + '</svg>'; }

/* ================= 通用 UI ================= */
function statusBadge(s){ var map={'首次接触':'info','跟进中':'warning','已寄样':'purple','已成交':'success','流失':'danger'}; return '<span class="badge badge-'+(map[s]||'gray')+'">'+s+'</span>'; }
function rateBadge(r){ var map={S:'gold',A:'blue',B:'gray',C:'cyan'}; return '<span class="badge badge-'+(map[r]||'gray')+'">'+r+' 级客户</span>'; }
function logBadge(s){ var map={pending:'warning',approved:'success',rejected:'danger'}; var txt={pending:'待审核',approved:'已发放',rejected:'已驳回'}; return '<span class="badge badge-'+(map[s]||'gray')+'">'+(txt[s]||s)+'</span>'; }
function ct(t, ic, extra){ return '<div class="card-title"><span class="ct-ico">'+icon(ic)+'</span>'+t+(extra||'')+'</div>'; }
function ph(title, desc, actions){ return '<div class="page-head"><div><div class="page-title">'+title+'</div><div class="page-desc">'+(desc||'')+'</div></div>'+(actions?'<div class="head-actions">'+actions+'</div>':'')+'</div>'; }
function stat(ic, color, label, val){ return '<div class="stat-card"><div class="stat-ico '+color+'">'+icon(ic)+'</div><div><div class="stat-value">'+val+'</div><div class="stat-label">'+label+'</div></div></div>'; }
function fmtMoney(n){ return '¥' + Number(n||0).toLocaleString('zh-CN'); }
function fmtUSD(n){ return '$' + Number(n||0).toLocaleString('zh-CN'); }
function pct(a,b){ return b===0 ? '0%' : Math.round(a/b*100)+'%'; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function openModal(html){ document.getElementById('modal-root').innerHTML = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
function toast(msg){ var t=document.getElementById('toast'); t.innerHTML=msg; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display='none'; },2600); }
function modalHead(title){ return '<div class="modal-title">'+title+'</div><button class="modal-close" onclick="closeModal()">×</button>'; }
function toggleMenu(){ document.querySelector('.sidebar').classList.toggle('open'); }

/* ================= 导航 ================= */
const NAV = {
  sales: [
    {group:'工作台', items:[{id:'dashboard',label:'工作台',icon:'dashboard'},{id:'crm',label:'客户管理',icon:'users'},{id:'points',label:'我的积分',icon:'award'}]},
    {group:'激励', items:[{id:'mall',label:'积分商城',icon:'bag'},{id:'leaderboard',label:'荣耀榜单',icon:'trophy'},{id:'rules',label:'积分规则',icon:'doc'}]}
  ],
  admin: [
    {group:'总览', items:[{id:'admin-dashboard',label:'数据总览',icon:'dashboard'},{id:'admin-review',label:'积分审核',icon:'check',badge:true},{id:'admin-crm',label:'客户管理',icon:'users'}]},
    {group:'运营', items:[{id:'admin-alibaba',label:'国际站看板',icon:'chart'},{id:'admin-site',label:'独立站看板',icon:'globe'},{id:'admin-mall',label:'商城管理',icon:'bag'},{id:'admin-users',label:'人员管理',icon:'user'}]}
  ]
};
function pendCount(){
  if(!CACHE.logs || !CACHE.exchanges) return 0;
  return CACHE.logs.filter(function(l){ return l.status==='pending'; }).length + CACHE.exchanges.filter(function(e){ return e.status==='pending'; }).length;
}
function renderSidebar(){
  const nav = NAV[state.role];
  const u = me();
  let html = '';
  nav.forEach(function(g){
    html += '<div class="nav-group-label">'+g.group+'</div>';
    html += g.items.map(function(it){
      const badge = (it.badge && pendCount()>0) ? '<span class="nav-badge">'+pendCount()+'</span>' : '';
      return '<div class="nav-item'+(state.view===it.id?' active':'')+'" onclick="go(\''+it.id+'\')"><span class="nav-ico">'+icon(it.icon)+'</span>'+it.label+badge+'</div>';
    }).join('');
  });
  document.getElementById('sidebar-nav').innerHTML = html;
  document.getElementById('sidebar-footer').innerHTML =
    '<div class="user-card" onclick="logout()" title="退出登录">' +
    '<div class="user-avatar">'+u.name.slice(0,1)+'</div>' +
    '<div class="user-info"><div class="user-name">'+u.name+'</div><div class="user-role">'+(u.role==='admin'?'系统管理员':(u.region||'业务员'))+'</div></div>' +
    '<span style="color:rgba(255,255,255,.4)">'+icon('out',16)+'</span></div>';
}
function go(v){
  state.view = v;
  document.querySelector('.sidebar').classList.remove('open');
  render();
}
async function render(){
  renderSidebar();
  const views = state.role==='admin' ? ADMIN_VIEWS : SALES_VIEWS;
  const fn = views[state.view];
  const viewEl = document.getElementById('view');
  viewEl.innerHTML = '<div class="empty-tip">加载中…</div>';
  try { viewEl.innerHTML = await fn(); }
  catch(e){ viewEl.innerHTML = '<div class="empty-tip">加载失败：'+e.message+'</div>'; }
}

/* ================= 登录 / 退出 ================= */
function setRole(r){ state.role=r; document.getElementById('tab-sales').className='role-tab'+(r==='sales'?' active':''); document.getElementById('tab-admin').className='role-tab'+(r==='admin'?' active':''); }
async function doLogin(){
  const name = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  if(!name || !password){ toast('请输入账号和密码'); return; }
  try {
    const d = await api('/login','POST',{name:name, password:password});
    TOKEN = d.token;
    localStorage.setItem('pp_token', TOKEN);
    state.user = d.user;
    state.role = d.user.role;
    state.view = d.user.role==='admin' ? 'admin-dashboard' : 'dashboard';
    enterApp();
  } catch(e){ toast(e.message); }
}
async function quickLogin(name, role){
  const password = role==='admin' ? 'admin123' : '123456';
  try {
    const d = await api('/login','POST',{name:name, password:password});
    TOKEN = d.token;
    localStorage.setItem('pp_token', TOKEN);
    state.user = d.user;
    state.role = d.user.role;
    state.view = d.user.role==='admin' ? 'admin-dashboard' : 'dashboard';
    enterApp();
  } catch(e){ toast('演示账号登录失败：'+e.message); }
}
function enterApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render();
  toast('欢迎回来，'+me().name);
}
function logout(){
  if(TOKEN){ api('/logout','POST').catch(function(){}); }
  TOKEN=''; localStorage.removeItem('pp_token');
  state.user=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('login-pass').value='';
}

    '</div>' +
    '<div class="crm-badges">'+rateBadge(c.rating)+statusBadge(c.status)+'</div>' +
    '<div class="crm-detail"><b>联系人：</b>'+c.contact+'<br><b>电话：</b>'+c.phone+(c.note?'<br><b>备注：</b>'+c.note:'')+'</div>' +
  '</div>';

async function viewDashboard(){
  const u = me();
  const [bal, customers, logs, lb, stats] = await Promise.all([
    api('/me/balance'), api('/customers'), api('/logs'), api('/leaderboard?tab=year'), api('/me/stats')
  ]);
  CACHE.logs = logs;
  const myCusts = customers;
  const deals = myCusts.filter(function(c){ return c.status==='已成交'; }).length;
  const pend = logs.filter(function(l){ return l.status==='pending'; });
  const pendPts = pend.reduce(function(s,l){ return s+l.pts; },0);
  const mon = today().slice(0,7);
  const monthEarn = logs.filter(function(l){ return l.status==='approved' && l.kind==='earn' && (l.date||'').indexOf(mon)===0; }).reduce(function(s,l){ return s+l.pts; },0);
  const recent = logs.slice(0,6);

        '<div class="mini-stat"><span>我的可用积分</span><b>'+bal.avail+' 分</b></div>' +
      '</div>' +
      (enough ? '' : '<div class="note-box"><b>提示：</b>可用积分不足，无法提交兑换申请。</div>') +
    '</div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1"'+(enough?' onclick="confirmExchange()"':' disabled')+'>确认兑换</button><button class="btn btn-outline" onclick="closeModal()">取消</button></div>');
}
async function confirmExchange(){
  try {
    await api('/mall/exchanges','POST',{ itemId: exItem.id });
    closeModal(); toast('兑换申请已提交，等待管理员发放'); render();
  } catch(e){ toast(e.message); }
}

/* ================= 管理员审核 ================= */
async function approveLog(id){ try{ await api('/logs/'+id,'PUT',{status:'approved'}); toast('已通过，积分已发放'); render(); }catch(e){ toast(e.message); } }
async function rejectLog(id){ try{ await api('/logs/'+id,'PUT',{status:'rejected'}); toast('已驳回该申请'); render(); }catch(e){ toast(e.message); } }
async function approveEx(id){ try{ await api('/mall/exchanges/'+id,'PUT',{status:'approved'}); toast('兑换已发放，可用积分已扣减'); render(); }catch(e){ toast(e.message); } }
async function rejectEx(id){ try{ await api('/mall/exchanges/'+id,'PUT',{status:'rejected'}); toast('已驳回该兑换申请'); render(); }catch(e){ toast(e.message); } }

/* ================= 手动调整 / 账号 ================= */
function openAdjust(uid, dir){
  const u = (CACHE.users||[]).find(function(x){ return x.id===uid; });
  const isAdd = dir==='add';
  openModal(modalHead((isAdd?'加发':'扣减')+'积分 · '+(u?u.name:'')) +
    '<div class="mini-stat" style="margin-bottom:14px"><span>当前可用积分</span><b>'+(u?u.avail:0)+' 分</b></div>' +
    '<label class="form-label">'+(isAdd?'加发':'扣减')+'数量 *</label><input class="form-input" id="adj-amt" type="number" min="1" placeholder="请输入积分数量">' +
    '<label class="form-label" style="margin-top:12px">原因 *（留痕备查）</label><textarea class="form-textarea" id="adj-reason" placeholder="如：季度奖励补发 / 违规扣减"></textarea>' +
    '<div style="display:flex;gap:10px;margin-top:20px"><button class="btn '+(isAdd?'btn-success':'btn-danger')+'" style="flex:1" onclick="submitAdjust('+uid+',\''+dir+'\')">确认'+(isAdd?'加发':'扣减')+'</button><button class="btn btn-outline" onclick="closeModal()">取消</button></div>');
}
async function submitAdjust(uid, dir){
  const amt = parseInt(document.getElementById('adj-amt').value);
  const reason = document.getElementById('adj-reason').value.trim();
  if(!amt || amt<=0){ toast('请输入有效数量'); return; }
  if(!reason){ toast('请填写原因'); return; }
  try {
    await api('/adjust','POST',{ userId: uid, pts: dir==='add'?amt:-amt, desc: reason });
    closeModal(); toast('已'+(dir==='add'?'加发 '+amt:'扣减 '+amt)+' 积分'); render();
  } catch(e){ toast(e.message); }
}
function openAddUser(){
  openModal(modalHead('新建业务员账号') +
    '<label class="form-label">姓名 *</label><input class="form-input" id="nu-name" placeholder="姓名（登录账号）">' +
    '<div class="form-row" style="margin-top:12px">' +
      '<div><label class="form-label">区域</label><input class="form-input" id="nu-region" placeholder="如：欧洲区"></div>' +
      '<div><label class="form-label">入职时间</label><input class="form-input" id="nu-joined" placeholder="如：2026-03"></div>' +
    '</div>' +
    '<label class="form-label" style="margin-top:12px">初始密码 *（至少 4 位）</label><input class="form-input" id="nu-pass" placeholder="初始密码">' +
    '<div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-primary" style="flex:1" onclick="submitAddUser()">创建</button><button class="btn btn-outline" onclick="closeModal()">取消</button></div>');
}
async function submitAddUser(){
  try {
    await api('/users','POST',{
      name: document.getElementById('nu-name').value.trim(),
      region: document.getElementById('nu-region').value.trim(),
      joined: document.getElementById('nu-joined').value.trim(),
      password: document.getElementById('nu-pass').value
    });
    closeModal(); toast('账号已创建'); render();
  } catch(e){ toast(e.message); }
}
function openResetPw(uid){
  const u = (CACHE.users||[]).find(function(x){ return x.id===uid; });
  openModal(modalHead('重置密码 · '+(u?u.name:'')) +
    '<label class="form-label">新密码 *（至少 4 位）</label><input class="form-input" id="rp-pass" placeholder="新密码">' +
    '<div style="display:flex;gap:10px;margin-top:20px"><button class="btn btn-primary" style="flex:1" onclick="submitResetPw('+uid+')">确认重置</button><button class="btn btn-outline" onclick="closeModal()">取消</button></div>');
}
async function submitResetPw(uid){
  try {
    await api('/users/'+uid+'/password','PUT',{ password: document.getElementById('rp-pass').value });
    closeModal(); toast('密码已重置'); render();
  } catch(e){ toast(e.message); }
}

/* ================= 初始化 ================= */
async function init(){
  document.getElementById('login-user').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('login-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  if(TOKEN){
    try {
      const d = await api('/me');
      state.user = d.user;
      state.role = d.user.role;
      state.view = d.user.role==='admin' ? 'admin-dashboard' : 'dashboard';
      enterApp();
    } catch(e){ logout(); }
  }
}
init();
</script>
